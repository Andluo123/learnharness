# x18n config for learnharness — generated by x18n init, then corrected:
# - dropped the i18n/{locale} pattern: it swallowed i18n/*.ts modules as a fake locale
# - added the app's own useT(namespace) hook (i18n/use-t.ts wraps next-intl createTranslator)
# yaml-language-server: $schema=https://x18n.dev/schema/config.json
sourceLocale: en
resources:
  - pattern: i18n/messages/{locale}.{ext}
usage:
  calls:
    - callee: useT
      factory: true
      returns: [t]
      keyPrefix:
        arg: 0
  # Keys reached through a variable the scanner cannot resolve. Listed by the
  # family they belong to, with the reason, so a future reader knows these are
  # deliberate and not dead copy.
  keysInUse:
    # components/practice-cards.tsx — OUTCOME_LABEL[outcome] maps an outcome id
    # to its catalog key, then t() resolves it.
    - practiceCards.solved
    - practiceCards.solvedWithHints
    - practiceCards.movedOn
    - practiceCards.surrendered
    - practiceCards.dismissed
    # components/settings/plugins-section.tsx — pluginDisplayName /
    # pluginDisplayDescription build "plugin.<id>.<field>" from the plugin id.
    - settingsPlugins.plugin.*.name
    - settingsPlugins.plugin.*.description
    # components/thinking-default.ts — t(`thinking.${level}`).
    - thinking.*
